<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 1</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }
        td {
            border: 1px solid black;
            padding: 8px 12px;
            vertical-align: top;
        }
        .photo-cell {
            text-align: right;
            width: 30%;
        }
    </style>
</head>
<body>

    <table>
        <!-- Name,photo -->
        <tr>
            <td style="width: 30%;">Name</td>
            <td></td>
            <td class="photo-cell">Photo</td>
        </tr>

        <!-- birthdy,Religion,Race -->
        <tr>
            <td>Date of birth</td>
            <td colspan="2"></td>
        </tr>
        <tr>
            <td>Religion</td>
            <td colspan="2"></td>
        </tr>
        <tr>
            <td>Race</td>
            <td colspan="2"></td>
        </tr>

        <!-- Address -->
        <tr>
            <td rowspan="4" style="vertical-align: middle;">Address</td>
            <td style="width: 30%;">Street</td>
            <td></td>
        </tr>
        <tr>
            <td>Town</td>
            <td></td>
        </tr>
        <tr>
            <td>District</td>
            <td></td>
        </tr>
        <tr>
            <td>State</td>
            <td></td>
        </tr>

        <!-- Contact -->
        <tr>
            <td rowspan="3" style="vertical-align: middle;">Contact</td>
            <td>Mobile Phone</td>
            <td></td>
        </tr>
        <tr>
            <td>Social Media</td>
            <td></td>
        </tr>
        <tr>
            <td>Website</td>
            <td></td>
        </tr>

        <!-- course -->
        <tr>
            <td>Course and<br>Institution</td>
            <td colspan="2"></td>
        </tr>
        <tr>
            <td>Programming skills</td>
            <td colspan="2"></td>
        </tr>
        <tr>
            <td>Hobbies</td>
            <td colspan="2"></td>
        </tr>
        <tr>
            <td>2026 Wishlist</td>
            <td colspan="2"></td>
        </tr>
    </table>

</body>
</html>
